name: Test on Pull Request

on:
  workflow_dispatch:  # scheduled auto-trigger disabled; run manually

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31

      - name: Nix build cache
        uses: Mic92/hestia@f1f4df2801140a36398ed423533c8460618539df # v3.0.1
        with:
          upstream-cache-filter: "true"

      # Same devShell (flake.nix) every other workflow and local development use --
      # go, make's own dependencies, etc. all come from there instead of a second,
      # drifting actions/setup-go + apt-get definition of the toolchain. Kept as
      # three separate steps (rather than one bash -c chaining all three) so a
      # failure's step name in the Actions UI says which one broke.
      - name: Build
        run: nix develop --command make

      - name: Vet
        run: nix develop --command go vet ./...

      - name: Test
        run: nix develop --command make test
