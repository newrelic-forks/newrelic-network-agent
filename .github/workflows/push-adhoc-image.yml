name: Push ad-hoc image

# The only workflow_dispatch path left that pushes to Docker Hub -- deliberately separate
# from publish-release.yml, which has none at all. That split is the actual point: the real
# release pipeline (VERSION bump -> cut-prerelease.yml -> publish-release.yml -> promote) is
# the only way to produce a tag that looks like a real version or `latest`. This workflow can
# only ever push a tag that structurally *cannot* be confused with one -- `just
# check-adhoc-tag` (see the Justfile) rejects the input outright if it's valid SemVer or is
# literally "latest", before anything gets built. That check lives in the Justfile rather
# than here or in flake.nix: it's a piece of release policy, not a package/devShell
# definition, and it needs to be runnable identically here and by hand before ever
# dispatching this.
#
# Never touches VERSION, never creates a tag/release, never promotes -- for a one-off build
# to poke at something outside a real release, not a substitute for one.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to push (must NOT be valid SemVer or "latest" -- those are reserved for the real release pipeline)'
        required: true

permissions:
  contents: read

jobs:
  # Gates the whole run on the tag check before anything builds -- separated out so the
  # per-platform `build` matrix below (and the arm64 runner it dispatches to) never even
  # starts for a rejected tag.
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31

      - name: Nix build cache
        uses: Mic92/hestia@f1f4df2801140a36398ed423533c8460618539df # v3.0.1
        with:
          upstream-cache-filter: "true"

      - name: Refuse a release-shaped tag
        env:
          TAG: ${{ inputs.tag }}
        run: nix develop --command just check-adhoc-tag "$TAG"

  # linux/amd64 and linux/arm64 build on their own native runner rather than one runner
  # building both via QEMU -- see cut-prerelease.yml's `build` job for why. Each per-arch
  # build pushes its image by digest only; `merge` below assembles both digests into the
  # one multi-platform `inputs.tag` manifest list.
  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runs-on: ubuntu-latest
          - platform: linux/arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to Docker Hub
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v4
        with:
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_PASS }}

      # See ci-build.yml/publish-release.yml for why this downloads MaxMind's databases
      # itself instead of inside the Docker build. Each platform downloads/caches its own
      # copy -- cheap, and keeps the two matrix jobs independent.
      - name: Cache key date
        id: date
        run: echo "date=$(date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Cache MaxMind databases
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: maxmind-dbs
          key: maxmind-dbs-${{ steps.date.outputs.date }}
          restore-keys: |
            maxmind-dbs-

      - name: Download MaxMind databases
        env:
          MM_ACCOUNT_ID: ${{ secrets.MM_ACCOUNT_ID }}
          MM_DOWNLOAD_KEY: ${{ secrets.MM_DOWNLOAD_KEY }}
        run: |
          set -eu
          if [ -f maxmind-dbs/GeoLite2-Country.mmdb ] && [ -f maxmind-dbs/GeoLite2-ASN.mmdb ]; then
            echo "Using cached MaxMind databases (exact match or restore-keys fallback)"
            exit 0
          fi
          if [ -z "$MM_DOWNLOAD_KEY" ]; then echo "maxmind license key secret (MM_DOWNLOAD_KEY) not provided"; exit 1; fi
          mkdir -p maxmind-dbs
          curl -sfL -o /tmp/country.tar.gz -u "$MM_ACCOUNT_ID:$MM_DOWNLOAD_KEY" "https://download.maxmind.com/geoip/databases/GeoLite2-Country/download?suffix=tar.gz"
          tar zxf /tmp/country.tar.gz --strip-components 1 -C maxmind-dbs
          curl -sfL -o /tmp/asn.tar.gz -u "$MM_ACCOUNT_ID:$MM_DOWNLOAD_KEY" "https://download.maxmind.com/geoip/databases/GeoLite2-ASN/download?suffix=tar.gz"
          tar zxf /tmp/asn.tar.gz --strip-components 1 -C maxmind-dbs

      # Artifact names can't contain `/`, which `linux/amd64`-style platform strings do --
      # used below to give each matrix job's digest artifact a distinct, valid name.
      - name: Set platform pair
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=newrelic/network-agent,push-by-digest=true,name-canonical=true,push=true
          build-args: |
            NETWORK_AGENT_VERSION=${{ inputs.tag }}
            NETWORK_AGENT_BUILD=manual-${{ github.run_id }}
            NR_SNMP_PROFILE_REPO=https://github.com/newrelic-forks/snmp-profiles

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Assembles the per-platform digests `build` pushed into the one `inputs.tag` manifest
  # list -- see `build`'s header comment, and cut-prerelease.yml's `merge` job.
  merge:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download digests
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to Docker Hub
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v4
        with:
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_PASS }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          # The whole point here is to split each digest filename (one per platform
          # `build` uploaded) into its own `imagetools create` argument.
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            --tag "newrelic/network-agent:${{ inputs.tag }}" \
            $(printf 'newrelic/network-agent@sha256:%s ' *)

      - name: Inspect pushed image
        run: docker buildx imagetools inspect "newrelic/network-agent:${{ inputs.tag }}"

      - name: Summary
        run: |
          {
            echo "## Pushed ad-hoc image to Docker Hub"
            echo "Tag: \`newrelic/network-agent:${{ inputs.tag }}\` (not a release -- never promoted, never touches VERSION)"
          } >> "$GITHUB_STEP_SUMMARY"
