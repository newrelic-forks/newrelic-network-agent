name: Publish Release

# Pushes a versioned, multi-arch image to Docker Hub (newrelic/network-agent). Two paths in,
# both driven only by real GitHub releases -- see push-adhoc-image.yml for the separate,
# deliberately non-release workflow_dispatch escape hatch:
#   - Publishing a pre-release (GitHub's "This is a pre-release" checkbox on a bare tag like
#     v0.1.0 -- cut automatically by cut-prerelease.yml when VERSION is bumped): builds from
#     source and pushes newrelic/network-agent:<version>-rc. The -rc suffix exists only on
#     this Docker Hub tag, never on the git tag/GitHub release itself (which stays bare) --
#     it's what lets the promote job below retag a specific, already-tested build without
#     ever having published the bare <version> tag before it was actually promoted.
#   - Promoting (by unchecking "pre-release" on that same release, e.g. via `just
#     release-promote`) to a full release: never rebuilds. Retags the already-pushed
#     <version>-rc image as <version> and `latest`, via `docker buildx imagetools create` --
#     so what ships is byte-identical to what was tested as a release candidate. If no
#     matching <version>-rc image exists, this fails on purpose: a full release must be
#     preceded by a tested pre-release of the same version.
#
# Both `published` and `released` are needed in the trigger below, and they cover different
# transitions -- GitHub does NOT re-fire `published` when an already-published pre-release is
# later edited to no longer be one (the promote flow above). That edit fires `released` (and
# `edited`) instead. `published` alone would mean the `promote` job never runs for that flow.
# `released` also happens to fire *alongside* `published` for a release that's published
# directly as non-prerelease -- a path this workflow doesn't support (`promote` requires a
# pre-existing pre-release of the same version and fails otherwise) -- so the concurrency
# group below just collapses that harmless double-fire into one run rather than two failures.
#
# Version format is enforced via `just check-semver` (a thin wrapper around semver-tool,
# not a homegrown regex) -- version-format-check.yml's `just check-version` protects the
# checked-in VERSION file the same way, so there's exactly one real implementation of "is
# this valid SemVer", runnable identically in CI or locally (`just check-semver 0.0.1`).
#
# ci-build.yml (stack/01) builds the same Dockerfile but only ever exports a local tarball --
# this is the one workflow in the repo that actually pushes real, numbered images anywhere.
# There is deliberately no workflow_dispatch trigger here: the only way to get a real
# <version>/<version>-rc/latest tag pushed is through the VERSION-driven pipeline. An ad-hoc
# build+push (for testing something outside a real release) is push-adhoc-image.yml's job --
# a structurally separate workflow that can only ever push a tag that's neither valid SemVer
# nor `latest`.
concurrency:
  group: publish-release-${{ github.event.release.tag_name || github.run_id }}
  cancel-in-progress: true

on:
  release:
    types: [published, released]

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      rc_tag: ${{ steps.version.outputs.rc_tag }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Determine version
        id: version
        env:
          # A release's tag_name is chosen by whoever creates the release -- untrusted,
          # attacker-shapeable text -- so it goes through env: rather than being
          # interpolated directly into this run: script via ${{ }}. GitHub expands ${{ }}
          # textually before bash ever parses the script, so a tag containing shell
          # metacharacters (git ref names allow $, `, ", ;, unlike GitHub Actions
          # expression syntax) would otherwise execute as part of the script itself.
          # github.event.release.prerelease below is a GitHub-controlled real boolean,
          # never attacker-supplied free text, so that one stays a plain ${{ }} expansion.
          RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${RELEASE_TAG_NAME#v}"

          # "latest" is reserved for the promote job's own latest tag -- refuse it as a
          # release version outright. Protects against someone creating a real GitHub
          # release/tag literally named "latest" directly on GitHub, bypassing
          # cut-prerelease.yml (which never produces one).
          case "$(printf '%s' "$VERSION" | tr '[:upper:]' '[:lower:]')" in
            latest)
              echo "::error::'latest' is not a valid version -- it's reserved for the promote job."
              exit 1
              ;;
          esac

          IS_PRERELEASE="${{ github.event.release.prerelease }}"

          {
            echo "version=$VERSION"
            echo "rc_tag=$VERSION-rc"
            echo "is_prerelease=$IS_PRERELEASE"
          } >> "$GITHUB_OUTPUT"

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31

      - name: Nix build cache
        uses: Mic92/hestia@f1f4df2801140a36398ed423533c8460618539df # v3.0.1
        with:
          upstream-cache-filter: "true"

      - name: Validate version is SemVer
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if ! nix develop --command just check-semver "$VERSION"; then
            echo "::error::'$VERSION' is not a valid SemVer version (MAJOR.MINOR.PATCH, optionally -prerelease)."
            exit 1
          fi

  # Builds from source: only a published pre-release. A full release never lands here --
  # see the `promote` job.
  publish:
    needs: version
    if: needs.version.outputs.is_prerelease == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      RC_TAG: ${{ needs.version.outputs.rc_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up QEMU        # enables cross-building (e.g. arm64 on an amd64 runner)
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to Docker Hub
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v4
        with:
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_PASS }}

      # See ci-build.yml for why this downloads MaxMind's databases itself (via
      # actions/cache) instead of inside the Docker build: a BuildKit `--mount=type=cache`
      # doesn't survive across CI runs, and isn't included in `--cache-from`/`--cache-to`
      # exports either. warm-maxmind-cache.yml (on main) is what this actually falls back
      # to on a cache miss, since a release build's own cache scope is otherwise as cold
      # as any other branch's. restore-keys is a second fallback layer on top of that --
      # see ci-build.yml for why.
      - name: Cache key date
        id: date
        run: echo "date=$(date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Cache MaxMind databases
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: maxmind-dbs
          key: maxmind-dbs-${{ steps.date.outputs.date }}
          restore-keys: |
            maxmind-dbs-

      - name: Download MaxMind databases
        env:
          MM_ACCOUNT_ID: ${{ secrets.MM_ACCOUNT_ID }}
          MM_DOWNLOAD_KEY: ${{ secrets.MM_DOWNLOAD_KEY }}
        run: |
          set -eu
          if [ -f maxmind-dbs/GeoLite2-Country.mmdb ] && [ -f maxmind-dbs/GeoLite2-ASN.mmdb ]; then
            echo "Using cached MaxMind databases (exact match or restore-keys fallback)"
            exit 0
          fi
          if [ -z "$MM_DOWNLOAD_KEY" ]; then echo "maxmind license key secret (MM_DOWNLOAD_KEY) not provided"; exit 1; fi
          mkdir -p maxmind-dbs
          curl -sfL -o /tmp/country.tar.gz -u "$MM_ACCOUNT_ID:$MM_DOWNLOAD_KEY" "https://download.maxmind.com/geoip/databases/GeoLite2-Country/download?suffix=tar.gz"
          tar zxf /tmp/country.tar.gz --strip-components 1 -C maxmind-dbs
          curl -sfL -o /tmp/asn.tar.gz -u "$MM_ACCOUNT_ID:$MM_DOWNLOAD_KEY" "https://download.maxmind.com/geoip/databases/GeoLite2-ASN/download?suffix=tar.gz"
          tar zxf /tmp/asn.tar.gz --strip-components 1 -C maxmind-dbs

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: newrelic/network-agent:${{ env.RC_TAG }}
          build-args: |
            NETWORK_AGENT_VERSION=${{ env.VERSION }}
            NETWORK_AGENT_BUILD=${{ github.event.release.tag_name }}
            NR_SNMP_PROFILE_REPO=https://github.com/newrelic-forks/snmp-profiles

      - name: Summary
        run: |
          {
            echo "## Published to Docker Hub"
            echo "Tag: \`newrelic/network-agent:$RC_TAG\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # Promotes a full release without rebuilding: retags the <version>-rc image already pushed
  # by this same version's pre-release build. Fails if none exists -- a full release must be
  # preceded by a tested pre-release of the same version, on purpose.
  promote:
    needs: version
    if: needs.version.outputs.is_prerelease == 'false'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      RC_TAG: ${{ needs.version.outputs.rc_tag }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to Docker Hub
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v4
        with:
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_PASS }}

      - name: Retag pre-release image as the full release
        run: |
          if ! docker buildx imagetools inspect "newrelic/network-agent:$RC_TAG" > /dev/null 2>&1; then
            echo "::error::No pre-release image found at newrelic/network-agent:$RC_TAG. Publish a pre-release for this version first and let it build -- a full release is never built directly."
            exit 1
          fi
          docker buildx imagetools create \
            --tag "newrelic/network-agent:$VERSION" \
            --tag newrelic/network-agent:latest \
            "newrelic/network-agent:$RC_TAG"

      - name: Summary
        run: |
          {
            echo "## Promoted to Docker Hub"
            echo "Retagged \`newrelic/network-agent:$RC_TAG\` as \`newrelic/network-agent:$VERSION\` and \`newrelic/network-agent:latest\` (no rebuild)."
          } >> "$GITHUB_STEP_SUMMARY"
