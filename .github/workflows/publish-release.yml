name: Publish Release

# Promotes a pre-release to a full release: retags the already-pushed
# newrelic/network-agent:<version>-rc image as <version> and `latest`, via `docker buildx
# imagetools create` -- no rebuild, so what ships is byte-identical to what was tested as a
# release candidate. If no matching <version>-rc image exists, this fails on purpose: a full
# release must be preceded by a tested pre-release of the same version.
#
# Cutting the pre-release and pushing its image is cut-prerelease.yml's job now, not this
# workflow's -- see that file's header comment for why (in short: chaining two workflows
# through a `release` event needs a non-GITHUB_TOKEN credential just to create the release,
# since GitHub won't fire a new workflow run for an event GITHUB_TOKEN created; folding
# cut+publish into one workflow avoids needing that credential at all). This workflow only
# reacts to `released` (never `published`) -- promoting (unchecking "pre-release", e.g. via
# `just release-promote`) is what fires it, since GitHub does NOT re-fire `published` when an
# already-published pre-release is edited to no longer be one.
#
# `released` can also fire for a release published directly as non-prerelease, bypassing
# cut-prerelease.yml entirely -- that's not a path this workflow is meant to support, and the
# checks below reject it: `is_prerelease` gates the `promote` job itself, and "Verify tag
# matches checked-in VERSION" refuses to act on a tag that doesn't match the checked-in
# VERSION file at the commit it points to. A real release, cut by cut-prerelease.yml, always
# has this hold, since it tags the exact commit that bumped VERSION to that value.
#
# Version format is enforced via `just check-semver` (a thin wrapper around semver-tool,
# not a homegrown regex) -- version-format-check.yml's `just check-version` protects the
# checked-in VERSION file the same way, so there's exactly one real implementation of "is
# this valid SemVer", runnable identically in CI or locally (`just check-semver 0.0.1`).
#
# There is deliberately no workflow_dispatch trigger here or on cut-prerelease.yml: the only
# way to get a real <version>/<version>-rc/latest tag pushed is through the VERSION-driven
# pipeline. An ad-hoc build+push (for testing something outside a real release) is
# push-adhoc-image.yml's job -- a structurally separate workflow that can only ever push a
# tag that's neither valid SemVer nor `latest`.
concurrency:
  group: publish-release-${{ github.event.release.tag_name || github.run_id }}
  cancel-in-progress: true

on:
  release:
    types: [released]

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      rc_tag: ${{ steps.version.outputs.rc_tag }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Determine version
        id: version
        env:
          # A release's tag_name is chosen by whoever creates the release -- untrusted,
          # attacker-shapeable text -- so it goes through env: rather than being
          # interpolated directly into this run: script via ${{ }}. GitHub expands ${{ }}
          # textually before bash ever parses the script, so a tag containing shell
          # metacharacters (git ref names allow $, `, ", ;, unlike GitHub Actions
          # expression syntax) would otherwise execute as part of the script itself.
          # github.event.release.prerelease below is a GitHub-controlled real boolean,
          # never attacker-supplied free text, so that one stays a plain ${{ }} expansion.
          RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${RELEASE_TAG_NAME#v}"

          # "latest" is reserved for the promote job's own latest tag -- refuse it as a
          # release version outright. Protects against someone creating a real GitHub
          # release/tag literally named "latest" directly on GitHub, bypassing
          # cut-prerelease.yml (which never produces one).
          case "$(printf '%s' "$VERSION" | tr '[:upper:]' '[:lower:]')" in
            latest)
              echo "::error::'latest' is not a valid version -- it's reserved for the promote job."
              exit 1
              ;;
          esac

          IS_PRERELEASE="${{ github.event.release.prerelease }}"

          {
            echo "version=$VERSION"
            echo "rc_tag=$VERSION-rc"
            echo "is_prerelease=$IS_PRERELEASE"
          } >> "$GITHUB_OUTPUT"

      # tag_name is chosen by whoever created the release, not derived from anything this
      # repo controls -- there's no tag protection stopping someone with write access from
      # creating a release with an arbitrary, unused version number on an arbitrary commit,
      # skipping the reviewed VERSION-bump PR entirely. This is the actual gate against
      # that: refuse to act unless the checked-out commit's own checked-in VERSION file
      # agrees with the tag. A real release, cut by cut-prerelease.yml, always has this
      # hold, since it tags the exact commit that bumped VERSION to that value.
      - name: Verify tag matches checked-in VERSION
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          CHECKED_IN="$(tr -d '[:space:]' < VERSION)"
          if [ "$CHECKED_IN" != "$VERSION" ]; then
            echo "::error::Release tag 'v$VERSION' doesn't match the checked-in VERSION file ('$CHECKED_IN') at this commit. A real release is always cut by cut-prerelease.yml from the exact commit that bumped VERSION to that value -- refusing to act."
            exit 1
          fi

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31

      - name: Nix build cache
        uses: Mic92/hestia@f1f4df2801140a36398ed423533c8460618539df # v3.0.1
        with:
          upstream-cache-filter: "true"

      - name: Validate version is SemVer
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if ! nix develop --command just check-semver "$VERSION"; then
            echo "::error::'$VERSION' is not a valid SemVer version (MAJOR.MINOR.PATCH, optionally -prerelease)."
            exit 1
          fi

  # Promotes a full release without rebuilding: retags the <version>-rc image already pushed
  # by cut-prerelease.yml's `publish` job for this same version. Fails if none exists -- a
  # full release must be preceded by a tested pre-release of the same version, on purpose.
  promote:
    needs: version
    if: needs.version.outputs.is_prerelease == 'false'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      RC_TAG: ${{ needs.version.outputs.rc_tag }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to Docker Hub
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v4
        with:
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_PASS }}

      - name: Retag pre-release image as the full release
        run: |
          if ! docker buildx imagetools inspect "newrelic/network-agent:$RC_TAG" > /dev/null 2>&1; then
            echo "::error::No pre-release image found at newrelic/network-agent:$RC_TAG. Publish a pre-release for this version first and let it build -- a full release is never built directly."
            exit 1
          fi
          docker buildx imagetools create \
            --tag "newrelic/network-agent:$VERSION" \
            --tag newrelic/network-agent:latest \
            "newrelic/network-agent:$RC_TAG"

      - name: Summary
        run: |
          {
            echo "## Promoted to Docker Hub"
            echo "Retagged \`newrelic/network-agent:$RC_TAG\` as \`newrelic/network-agent:$VERSION\` and \`newrelic/network-agent:latest\` (no rebuild)."
          } >> "$GITHUB_STEP_SUMMARY"
