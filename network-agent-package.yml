meta:
  description: New Relic Network Agent
  vendor: New Relic
  maintainer: New Relic

conditional:
  - when: format == "deb"
    depends:
      - git-core
  - when: format == "rpm"
    depends:
      - git-core

files:
  "/usr/bin/newrelic-network-agent":
    file: bin/newrelic-network-agent
    mode: "0755"
    user: newrelic-network-agent

  "/etc/newrelic-network-agent/GeoLite2-ASN.mmdb":
    file: config/GeoLite2-ASN.mmdb
    mode: "0644"
    user: newrelic-network-agent

  "/etc/newrelic-network-agent/GeoLite2-Country.mmdb":
    file: config/GeoLite2-Country.mmdb
    mode: "0644"
    user: newrelic-network-agent

  "/etc/newrelic-network-agent/devices.json":
    file: config/devices.json
    mode: "0644"
    user: newrelic-network-agent

  "/etc/newrelic-network-agent/snmp-base.yaml":
    file: config/snmp-base.yaml
    mode: "0644"
    user: newrelic-network-agent
    keep: true

  "/etc/default/newrelic-network-agent.env.sample":
    file: config/newrelic-network-agent.env.sample
    mode: "0644"
    user: newrelic-network-agent

  "/etc/newrelic-network-agent/udr.csv":
    file: config/udr.csv
    mode: "0644"
    user: newrelic-network-agent

  "/etc/newrelic-network-agent/config.json":
    file: config/config.json
    mode: "0644"
    user: newrelic-network-agent

  "/etc/newrelic-network-agent/mibs.db/000243.ldb":
    file: config/mibs.db/000243.ldb
    mode: "0644"
    user: newrelic-network-agent

  "/etc/newrelic-network-agent/mibs.db/000244.ldb":
    file: config/mibs.db/000244.ldb
    mode: "0644"
    user: newrelic-network-agent

  "/etc/newrelic-network-agent/mibs.db/000245.ldb":
    file: config/mibs.db/000245.ldb
    mode: "0644"
    user: newrelic-network-agent

  "/etc/newrelic-network-agent/mibs.db/001158.log":
    file: config/mibs.db/001158.log
    mode: "0644"
    user: newrelic-network-agent

  "/etc/newrelic-network-agent/mibs.db/CURRENT":
    file: config/mibs.db/CURRENT
    mode: "0644"
    user: newrelic-network-agent

  "/etc/newrelic-network-agent/mibs.db/CURRENT.bak":
    file: config/mibs.db/CURRENT.bak
    mode: "0644"
    user: newrelic-network-agent

  "/etc/newrelic-network-agent/mibs.db/LOCK":
    file: config/mibs.db/LOCK
    mode: "0644"
    user: newrelic-network-agent

  "/etc/newrelic-network-agent/mibs.db/LOG":
    file: config/mibs.db/LOG
    mode: "0644"
    user: newrelic-network-agent

  "/etc/newrelic-network-agent/mibs.db/MANIFEST-001159":
    file: config/mibs.db/MANIFEST-001159
    mode: "0644"
    user: newrelic-network-agent

dirs:
  - "/etc/newrelic-network-agent"
  - "/etc/newrelic-network-agent/mibs.db"

units:
  - newrelic-network-agent.service
  - newrelic-network-agent@.service

scripts:
  "post-install": scripts/post-install

user: newrelic-network-agent
