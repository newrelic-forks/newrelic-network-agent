# Generic discovery-only SNMP config template for testing/nr/run-snmp-test.sh.
# Rendered into testing/nr/state/<site>/snmp.yaml the first time a site is
# brought up -- this file itself must stay free of any real device
# inventory, IPs, or credentials. __SITE_CIDR__ and __SITE_COMMUNITY__ are
# substituted at render time from the --cidr flag and the SNMP_COMMUNITY
# secret (see README.md); everything else mirrors ktranslate's defaults.
rwmutex: {}
devices: {}
trap:
    listen: 0.0.0.0:1620
discovery:
    cidrs:
        - __SITE_CIDR__
    ignore_list: []
    debug: false
    ports:
        - 161
    default_communities:
        - __SITE_COMMUNITY__
    use_snmp_v1: false
    default_v3: null
    add_devices: true
    add_mibs: true
    threads: 4
    replace_devices: true
    check_all_ips: true
    kentik: null
    no_use_bulkwalkall: false
    netbox: null
global:
    poll_time_sec: 60
    drop_if_outside_poll: false
    mib_profile_dir: /etc/ktranslate/profiles
    mibs_db: ""
    mibs_enabled:
        - HOST-RESOURCES-MIB
        - IF-MIB
        - IP-MIB
        - ENTITY-MIB
        - LLDP-MIB
    timeout_ms: 3000
    retries: 0
    global_v3: null
    response_time: true
    ping_interval_sec: 30
    purge_devices_after_num: 0
    no_device_hardcoded_oids: false
    jitter_time_sec: 10
    fast_poll: false
    watch_profile_changes: true
