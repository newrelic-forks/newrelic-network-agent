# Declares the secrets testing/nr/run-snmp-test.sh needs -- names and
# descriptions only, no values. Set up a provider once with
# `secretspec config global init` (pick onepassword), then always run
# scripts via `secretspec run -- ...` so real values are injected into the
# environment and never touch disk. See testing/nr/README.md.

[project]
name = "ktranslate-nr-testing"
revision = "1.0"

[profiles.default]
NEW_RELIC_API_KEY = { description = "New Relic ingest API key for the account used by testing/nr scripts" }
SNMP_COMMUNITY = { description = "SNMP v2c community string for the switches/routers polled by testing/nr scripts" }
