apiVersion: apps/v1
kind: Deployment
metadata:
  name: newrelic-network-agent
spec:
  selector:
    matchLabels:
      app: newrelic-network-agent
  template:
    metadata:
      labels:
        app: newrelic-network-agent
    spec:
      containers:
      - name: newrelic-network-agent
        image: newrelic/network-agent:latest
        imagePullPolicy: Always
        args:
          - --listen=0.0.0.0:8082
          - --metalisten=0.0.0.0:8083
          - --snmp=/etc/newrelic-network-agent/snmp.yml
          - --log_level=info
          - --nf.source=sflow
          - --nf.addr=0.0.0.0
          - --nf.port=6343
          - --sinks=prometheus
          - --format=prometheus
          - --prom_listen=:8084
        resources:
          limits:
            cpu: 1000m
            memory: 256Mi
          requests:
            cpu: 500m
            memory: 128Mi
        ports:
        - name: firehose
          containerPort: 8082
        - name: metadata
          containerPort: 8083
        - name: prometheus
          containerPort: 8084
        - name: sflow
          containerPort: 6343
          protocol: UDP
        livenessProbe:
          httpGet:
            path: /metrics
            port: metadata
          initialDelaySeconds: 5
          periodSeconds: 5
        readinessProbe:
          httpGet:
            path: /metrics
            port: metadata
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
          - name: newrelic-network-agent-config
            mountPath: /etc/newrelic-network-agent/snmp.yml
            subPath: snmp.yml
      volumes:
        - name: newrelic-network-agent-config
          configMap:
            name: newrelic-network-agent-config

---
apiVersion: v1
kind: Service
metadata:
  name: newrelic-network-agent-firehose
  labels:
    app: newrelic-network-agent
spec:
  ports:
  - port: 8082
    name: firehose
    targetPort: 8082
    protocol: TCP
  selector:
    app: newrelic-network-agent

---
apiVersion: v1
kind: Service
metadata:
  name: newrelic-network-agent-metadata
  labels:
    app: newrelic-network-agent
spec:
  ports:
  - port: 8083
    name: metadata
    targetPort: 8083
    protocol: TCP
  selector:
    app: newrelic-network-agent

---
apiVersion: v1
kind: Service
metadata:
  name: newrelic-network-agent-prom
  labels:
    app: newrelic-network-agent
spec:
  ports:
  - port: 8084
    name: prom
    targetPort: 8084
    protocol: TCP
  selector:
    app: newrelic-network-agent
---
apiVersion: v1
kind: Service
metadata:
  name: newrelic-network-agent-sflow
  labels:
    app: newrelic-network-agent
spec:
  ports:
  - port: 6343
    name: sflow
    targetPort: 6343
    protocol: UDP
  selector:
    app: newrelic-network-agent

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: newrelic-network-agent-config
data:
  snmp.yml: |
    devices:
      switch:
        device_name: switch
        device_ip: 10.10.0.10
        flow_only: true
        user_tags: {}
    global:
      poll_time_sec: 30
      drop_if_outside_poll: false
      mib_profile_dir: /etc/newrelic-network-agent/profiles
      mibs_db: /etc/newrelic-network-agent/mibs.db
      mibs_enabled:
      - IF-MIB
      timeout_ms: 3000
      retries: 0
