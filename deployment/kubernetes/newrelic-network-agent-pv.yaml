apiVersion: apps/v1
kind: Deployment
metadata:
  name: newrelic-network-agent-discovery
spec:
  selector:
    matchLabels:
      app: newrelic-network-agent-discovery
  template:
    metadata:
      labels:
        app: newrelic-network-agent-discovery
    spec:
      containers:
      - name: discovery
        image: newrelic/network-agent:latest
        imagePullPolicy: Always
        args:
          - -snmp
          - /data/snmp.yaml
          - -log_level=info
          - -snmp_discovery=true
        resources:
          limits:
            cpu: 1000m
            memory: 256Mi
          requests:
            cpu: 500m
            memory: 128Mi
        volumeMounts:
          - name: newrelic-network-agent-discovery-claim
            mountPath: /data
      volumes:
        - name: newrelic-network-agent-discovery-claim
          hostPath:
            path: /mnt/data/

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: newrelic-network-agent
spec:
  selector:
    matchLabels:
      app: newrelic-network-agent
  template:
    metadata:
      labels:
        app: newrelic-network-agent
    spec:
      containers:
      - name: newrelic-network-agent
        image: newrelic/network-agent:latest
        imagePullPolicy: Always
        args:
          - --listen=0.0.0.0:8082
          - --metalisten=0.0.0.0:8083
          - --snmp=/data/snmp.yaml
          - --log_level=info
          - --nf.source=sflow
          - --nf.addr=0.0.0.0
          - --nf.port=6343
          - --sinks=prometheus
          - --format=prometheus
          - --prom_listen=:8084
        resources:
          limits:
            cpu: 1000m
            memory: 256Mi
          requests:
            cpu: 500m
            memory: 128Mi
        ports:
        - name: firehose
          containerPort: 8082
        - name: metadata
          containerPort: 8083
        - name: prometheus
          containerPort: 8084
        - name: sflow
          containerPort: 6343
          protocol: UDP
        livenessProbe:
          httpGet:
            path: /metrics
            port: metadata
          initialDelaySeconds: 5
          periodSeconds: 5
        readinessProbe:
          httpGet:
            path: /metrics
            port: metadata
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
          - name: newrelic-network-agent-discovery-claim
            mountPath: /data
      volumes:
        - name: newrelic-network-agent-discovery-claim
          hostPath:
            path: /mnt/data/

---
apiVersion: v1
kind: Service
metadata:
  name: newrelic-network-agent-firehose
  labels:
    app: newrelic-network-agent
spec:
  ports:
  - port: 8082
    name: firehose
    targetPort: 8082
    protocol: TCP
  selector:
    app: newrelic-network-agent

---
apiVersion: v1
kind: Service
metadata:
  name: newrelic-network-agent-metadata
  labels:
    app: newrelic-network-agent
spec:
  ports:
  - port: 8083
    name: metadata
    targetPort: 8083
    protocol: TCP
  selector:
    app: newrelic-network-agent

---
apiVersion: v1
kind: Service
metadata:
  name: newrelic-network-agent-prom
  labels:
    app: newrelic-network-agent
spec:
  ports:
  - port: 8084
    name: prom
    targetPort: 8084
    protocol: TCP
  selector:
    app: newrelic-network-agent
---
apiVersion: v1
kind: Service
metadata:
  name: newrelic-network-agent-sflow
  labels:
    app: newrelic-network-agent
spec:
  ports:
  - port: 6343
    name: sflow
    targetPort: 6343
    protocol: UDP
  selector:
    app: newrelic-network-agent

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: newrelic-network-agent-discovery-claim
spec:
  storageClassName: "" # Empty string must be explicitly set otherwise default StorageClass will be set
  volumeName: newrelic-network-agent-pv-volume
metadata:
  name: newrelic-network-agent-discovery-claim

---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: newrelic-network-agent-pv-volume
  labels:
    type: local
spec:
  storageClassName: manual
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: "/mnt/data"
